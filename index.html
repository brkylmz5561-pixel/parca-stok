<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Parça Stok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --ink:#14232B; --ink2:#52646D; --paper:#EEF1EF; --card:#FFFFFF; --line:#D6DCD9; --wash:#E3E8E5;
  --blue:#1F4FB4; --onblue:#FFFFFF; --bluewash:#DCE6FA;
  --label:#F2C230; --onlabel:#2A2100;
  --red:#B8332A; --onred:#FFFFFF; --redwash:#F8E1DE;
  --green:#25703F; --greenwash:#DDF0E3;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --disp:'Barlow Semi Condensed','Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#E7EEF0; --ink2:#9FB2BB; --paper:#0E1A20; --card:#16262E; --line:#2A3C45; --wash:#1D2F38;
    --blue:#7EA5FF; --onblue:#0A1A3D; --bluewash:#1B2D52;
    --red:#FF8A7E; --onred:#2A0B08; --redwash:#3A1E1C;
    --green:#6FD08F; --greenwash:#16301F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E7EEF0; --ink2:#9FB2BB; --paper:#0E1A20; --card:#16262E; --line:#2A3C45; --wash:#1D2F38;
  --blue:#7EA5FF; --onblue:#0A1A3D; --bluewash:#1B2D52;
  --red:#FF8A7E; --onred:#2A0B08; --redwash:#3A1E1C;
  --green:#6FD08F; --greenwash:#16301F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 17px/1.4 var(--font);-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

#screen{max-width:560px;margin:0 auto;padding:0 16px 104px}
.top{padding:18px 0 10px}
.top h1{font:700 32px/1.05 var(--disp);letter-spacing:-.01em}
.sum{color:var(--ink2);font-size:15px;margin-top:4px}
.lead{color:var(--ink2);margin:0 0 16px}
.sec{font:600 20px/1.2 var(--disp);margin:24px 0 8px}
.note{font-size:15px;color:var(--ink2);background:var(--wash);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.hint{font-size:14px;color:var(--ink2);margin-top:6px;min-height:20px}
.err{color:var(--red);font-size:15px;font-weight:600;min-height:0;margin:0 0 10px}
.err:empty{display:none}
.lnk{background:none;border:0;padding:6px 0;color:var(--blue);font-weight:600;font-size:15px}

#banner:not(:empty){max-width:560px;margin:10px auto 0;padding:10px 16px;background:var(--redwash);color:var(--red);font-weight:600;font-size:15px}

/* Tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px 0;color:var(--ink2);font:600 12px/1 var(--font);min-height:52px;border-radius:12px}
.tab .ic{width:48px;height:28px;display:grid;place-items:center;border-radius:14px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--blue)}
.tab[aria-current="page"] .ic{background:var(--bluewash)}
.tab.scan{color:var(--ink)}
.tab.scan .ic{background:var(--label);color:var(--onlabel);width:60px}
.tab.scan[aria-current="page"]{color:var(--blue)}
.tab.scan[aria-current="page"] .ic{background:var(--label);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--blue)}

/* Stock list */
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin:0 -16px;padding:0 16px 8px}
.in{width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:17px;color:var(--ink)}
.sheet .in{background:var(--paper)}
.in::placeholder{color:var(--ink2);opacity:.8}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.prow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.pmain{display:flex;flex-direction:column;gap:1px;min-width:0}
.pno{font:700 21px/1.15 var(--disp);letter-spacing:.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pbrand{font-weight:600;font-size:15px}
.pdesc{color:var(--ink2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.praf{align-self:flex-start;margin-top:5px;font-size:13px;font-weight:600;background:var(--wash);border-radius:6px;padding:2px 8px}
.pqty{display:flex;flex-direction:column;align-items:flex-end;min-width:64px}
.pqty b{font:700 32px/1 var(--disp);font-variant-numeric:tabular-nums}
.pqty small{font-size:13px;color:var(--ink2);margin-top:2px}
.pqty.low b,.pqty.low small{color:var(--red);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;min-height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--blue);color:var(--onblue);font:600 17px/1 var(--font);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.empty{padding:28px 4px;text-align:left}
.empty h2{font:700 24px/1.15 var(--disp);margin-bottom:6px}
.empty p{color:var(--ink2);margin-bottom:16px}
.empty.small{padding:16px 0}
.empty-actions{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* Camera */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--wash);padding:4px;border-radius:14px}
.seg button{min-height:46px;border:2px solid transparent;border-radius:11px;background:none;font:600 16px/1 var(--font);color:var(--ink2)}
.seg button[aria-pressed="true"][data-v="in"]{background:var(--greenwash);color:var(--green);border-color:var(--green)}
.seg button[aria-pressed="true"][data-v="out"]{background:var(--redwash);color:var(--red);border-color:var(--red)}
.vf{position:relative;aspect-ratio:4/3;background:#0B1418;border-radius:16px;overflow:hidden;margin:12px 0}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.vf.native video{display:block}
#h5q{position:absolute;inset:0;border:0!important;display:none;overflow:hidden}
.vf.lib #h5q{display:block}
#h5q video{width:100%!important;height:100%!important;object-fit:cover;display:block}
.frame{position:absolute;inset:24% 8%;pointer-events:none;opacity:0}
.vf.run .frame{opacity:1}
.frame i{position:absolute;width:30px;height:30px;border:0 solid var(--label)}
.frame i:nth-child(1){left:0;top:0;border-width:4px 0 0 4px;border-top-left-radius:10px}
.frame i:nth-child(2){right:0;top:0;border-width:4px 4px 0 0;border-top-right-radius:10px}
.frame i:nth-child(3){left:0;bottom:0;border-width:0 0 4px 4px;border-bottom-left-radius:10px}
.frame i:nth-child(4){right:0;bottom:0;border-width:0 4px 4px 0;border-bottom-right-radius:10px}
.frame .line{position:absolute;left:5%;right:5%;top:8%;height:2px;background:var(--label);opacity:.9;animation:sweep 2.4s ease-in-out infinite alternate}
@keyframes sweep{to{top:90%}}
.vf-msg{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:22px;color:#EAF0F2}
.vf-msg p{max-width:30ch}
.vf.run .vf-msg{display:none}
.vf-stop{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:22px;border:0;background:rgba(0,0,0,.5);color:#fff;display:none;place-items:center}
.vf.run .vf-stop{display:grid}
.vf-dbg{position:absolute;left:6px;bottom:6px;z-index:5;font:11px/1.35 ui-monospace,monospace;color:#9fe3c8;background:rgba(0,0,0,.65);padding:5px 8px;border-radius:7px;pointer-events:none;max-width:92%;white-space:pre-wrap}
.btn.photo{position:relative;overflow:hidden}
.btn.photo input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.vf .btn{background:var(--card)}
.vf .btn.primary{background:var(--blue)}
.inrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.field{display:block;margin:0 0 12px}
.field>label,.field>span{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow .l{display:flex;flex-direction:column;min-width:0}
.mrow .l b{font:700 18px/1.2 var(--disp)}
.mrow .l span{font-size:14px;color:var(--ink2)}
.mrow .r{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.mrow .r b{font:700 20px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.mrow .r span{font-size:13px;color:var(--ink2)}
.pos-t{color:var(--green)}
.neg-t{color:var(--red)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:600 17px/1 var(--font);color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.btn.big{width:100%;min-height:56px;font-size:19px}
.btn.ghost{background:none;border-color:transparent;color:var(--blue)}
.btn.danger{background:none;border-color:var(--red);color:var(--red)}
.btn.dangerfill{background:var(--red);border-color:var(--red);color:var(--onred)}
.btn[disabled]{opacity:.45;cursor:default}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:10px}

/* Sheets */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,18,24,.55)}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out;outline:0}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sh-head h2{font:700 26px/1.15 var(--disp)}
.sh-title{display:flex;flex-direction:column;min-width:0}
.sh-title .pno{font-size:28px}
.sh-title span{color:var(--ink2)}
.x{flex:none;width:44px;height:44px;margin:-6px -8px 0 0;border:0;background:none;color:var(--ink2);display:grid;place-items:center;border-radius:22px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--ink2)}
.kv b{font-weight:600}
.sheet .seg{margin:14px 0 12px}
.stepper{display:grid;grid-template-columns:60px 1fr 60px;gap:8px}
.stepper button{min-height:60px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font:600 28px/1 var(--disp)}
.stepper input{text-align:center;font:700 34px/1 var(--disp);min-height:60px}
.sheet .btn.big{margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pick{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none}
.pick b{font:700 20px/1.2 var(--disp)}
.pick span{color:var(--ink2);font-size:15px}
.hist .mrow{padding:8px 0}
.sh2{font:600 18px/1.2 var(--disp);margin:20px 0 4px}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:16px}
.check input{width:24px;height:24px;flex:none;margin:0}

/* Count rows */
.crow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.cmain{display:flex;flex-direction:column;min-width:0}
.cmain .sub{font-size:14px;color:var(--ink2)}
.cstep{display:grid;grid-template-columns:44px 64px 44px;gap:6px}
.cstep button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font:600 22px/1 var(--disp)}
.cstep input{text-align:center;padding:0;font:700 22px/1 var(--disp);min-height:44px}
.cfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;font-size:14px;font-weight:600;border-radius:6px;padding:3px 9px}
.badge.ok{background:var(--greenwash);color:var(--green)}
.badge.neg{background:var(--redwash);color:var(--red)}
.badge.pos{background:var(--bluewash);color:var(--blue)}
.actions{margin-top:18px;display:flex;flex-direction:column;gap:8px}

/* Daha */
.block{border-top:1px solid var(--line);padding:18px 0}
.block h2{font:600 20px/1.2 var(--disp);margin-bottom:6px}
.block p{color:var(--ink2);margin-bottom:12px}
.block .stack{margin-top:0}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:70;max-width:min(92%,480px);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;font-weight:500;font-size:16px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--red);color:var(--onred)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="banner" role="alert"></div>
<main id="screen"></main>
<nav id="tabs" aria-label="Ana menü">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-tab="stok"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3.5 7.5L12 3.5l8.5 4v9L12 20.5l-8.5-4z"/><path d="M3.5 7.5L12 11.5l8.5-4M12 11.5v9"/></svg></span>Stok</button>
    <button class="tab scan" data-act="tab" data-tab="tara"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M4 12h16"/></svg></span>Tara</button>
    <button class="tab" data-act="tab" data-tab="sayim"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="13" height="16.5" rx="2"/><path d="M9 4.5V3.5h6v1M9 13.5l2.2 2.2L15.5 11"/></svg></span>Sayım</button>
    <button class="tab" data-act="tab" data-tab="daha"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></span>Daha</button>
  </div>
</nav>
<div id="layers"></div>
<div id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ================= yardımcılar ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
const nf = new Intl.NumberFormat('tr-TR');
const money = n => {
  n = Number(n) || 0;
  return new Intl.NumberFormat('tr-TR', {style:'currency', currency:'TRY', minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2}).format(n);
};
const fmtDate = iso => new Date(iso).toLocaleString('tr-TR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const norm = s => String(s == null ? '' : s).toLocaleLowerCase('tr').replace(/[\s\-_.\/]+/g, '');
const normCode = s => String(s == null ? '' : s).trim().replace(/\s+/g, '').replace(/^0+(?=\d)/, '');
const sign = n => n > 0 ? '+' + n : n < 0 ? '\u2212' + Math.abs(n) : '0';
const parseNum = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; };
const TUR = {giris:'Giriş', cikis:'Çıkış', sayim:'Sayım', duzeltme:'Düzeltme', ilk:'İlk stok'};
const X_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

/* ================= veri ================= */
const KEY = 'parca-stok-v1';
let memOnly = false;
const fresh = () => ({parts: [], moves: [], counts: [], active: null});
let S = (() => {
  try {
    localStorage.setItem(KEY + '-t', '1'); localStorage.removeItem(KEY + '-t');
    const r = localStorage.getItem(KEY);
    if (r) return Object.assign(fresh(), JSON.parse(r));
  } catch (e) { memOnly = true; }
  return fresh();
})();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!memOnly) { memOnly = true; showBanner(); } }
}
function showBanner() {
  $('#banner').textContent = memOnly ? 'Bu tarayıcı veri saklamaya izin vermiyor. Sayfayı kapatınca veriler silinir. Önemli listeleri Excel\'e aktar.' : '';
}
showBanner();

const partById = id => S.parts.find(p => p.id === id);
const isLow = p => p.adet === 0 || (p.min > 0 && p.adet <= p.min);
const findByBarcode = code => { const c = normCode(code); return c ? S.parts.find(p => p.barkod && normCode(p.barkod) === c) : null; };

function addPart(d) {
  const t = nowISO();
  const p = {id: uid(), barkod: d.barkod || '', marka: d.marka || '', parcaNo: d.parcaNo || '', aciklama: d.aciklama || '',
             raf: d.raf || '', fiyat: d.fiyat || 0, min: d.min || 0, adet: 0, olusturma: t, guncelleme: t};
  S.parts.unshift(p);
  if (d.adet > 0) adjust(p, d.adet, 'ilk'); else save();
  return p;
}
function adjust(p, delta, tur) {
  const before = p.adet;
  p.adet = Math.max(0, before + delta);
  const real = p.adet - before;
  p.guncelleme = nowISO();
  S.moves.unshift({id: uid(), partId: p.id, parcaNo: p.parcaNo, marka: p.marka, degisim: real, tur, sonAdet: p.adet, tarih: p.guncelleme});
  if (S.moves.length > 1000) S.moves.length = 1000;
  save();
  return real;
}
function lookup(text) {
  const t = String(text).trim();
  if (!t) return {kind: 'none'};
  const p = findByBarcode(t);
  if (p) return {kind: 'one', p};
  const ms = S.parts.filter(x => norm(x.parcaNo) === norm(t));
  if (ms.length === 1) return {kind: 'one', p: ms[0]};
  if (ms.length > 1) return {kind: 'many', ms};
  return {kind: 'new'};
}
const prefillFrom = t => /^\d{6,}$/.test(t.trim()) ? {barkod: t.trim()} : {parcaNo: t.trim()};

/* ================= arayüz durumu ================= */
const ui = {tab: 'stok', q: '', filter: 'all', mode: 'in'};
let scanPaused = false;

/* ================= toast ================= */
let toastT;
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.className = ''; }, 2600);
}

/* ================= katmanlar (sheet) ================= */
const layers = [];
function openSheet(html, onClose) {
  const layer = document.createElement('div');
  layer.className = 'layer';
  layer.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grab"></div>' + html + '</div>';
  const sheet = layer.firstElementChild;
  const rec = {layer, closed: false};
  const close = () => {
    if (rec.closed) return;
    rec.closed = true;
    layer.remove();
    layers.splice(layers.indexOf(rec), 1);
    if (!layers.length) { document.body.classList.remove('lock'); scanPaused = false; cam.lastAt = Date.now(); }
    if (onClose) onClose();
  };
  rec.close = close;
  layer.addEventListener('click', e => { if (e.target === layer || e.target.closest('[data-close]')) close(); });
  $('#layers').appendChild(layer);
  layers.push(rec);
  document.body.classList.add('lock');
  scanPaused = true;
  try { sheet.focus({preventScroll: true}); } catch (e) {}
  return {el: sheet, close};
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && layers.length) layers[layers.length - 1].close();
});
function confirmSheet({title, text, ok, danger}) {
  return new Promise(res => {
    let result = false;
    const {el, close} = openSheet(

/* ================= kamera ================= */
const FORMATS_NATIVE = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code','data_matrix'];
const cam = {stream: null, timer: 0, libTimer: 0, token: 0, wanted: false, running: false, detector: null, handler: null, lastCode: '', lastAt: 0};
const camEl = document.createElement('div');
camEl.className = 'vf idle';
camEl.innerHTML = '<video playsinline muted></video><div id="h5q"></div>' +
  '<div class="frame"><i></i><i></i><i></i><i></i><b class="line"></b></div>' +
  '<button class="vf-stop" data-act="camstop" aria-label="Kamerayı kapat">' + X_ICON + '</button>' +
  '<div class="vf-msg"></div>' +
  '<div class="vf-dbg"></div>';
const camVideo = camEl.querySelector('video');
camVideo.muted = true;
const camMsg = camEl.querySelector('.vf-msg');
const camDbg = camEl.querySelector('.vf-dbg');
function dbg(s) { if (camDbg) camDbg.textContent = s; }

function setCam(state, msg) {
  camEl.classList.remove('idle', 'starting', 'run', 'err');
  camEl.classList.add(state);
  if (state === 'idle') camMsg.innerHTML = '<p>Barkodu çerçevenin içine getir.</p><button class="btn primary" data-act="camstart">Kamerayı aç</button>';
  else if (state === 'starting') camMsg.innerHTML = '<p>Kamera açılıyor…</p>';
  else if (state === 'err') camMsg.innerHTML = '<p>' + esc(msg) + '</p><button class="btn primary" data-act="camstart">Tekrar dene</button>';
  else camMsg.innerHTML = '';
}
function camErr(e) {
  const txt = typeof e === 'string' ? e : ((e && e.name) || '') + ' ' + ((e && e.message) || '');
  if (/NotAllowed|Permission|Security/i.test(txt)) return 'Kameraya izin verilmedi. Taraycıdaki site ayarlarından kamera iznini aç ya da barkodu aşağıya elle yaz.';
  if (/NotFound|Overconstrained|Requested device/i.test(txt)) return 'Bu cihazda kullanılabilir kamera bulunamadı.';
  if (/NotReadable|TrackStart/i.test(txt)) return 'Kamera başka bir uygulama tarafından kullanılıyor.';
  if (/lib/.test(txt)) return 'Okuyucu bileşeni yüklenemedi. İnternet bağlantını kontrol et ya da barkodu elle yaz.';
  return 'Kamera açılamadı. Barkodu aşağıya elle yazabilirsin.';
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('lib'));
    document.head.appendChild(s);
  });
}
async function loadH5() {
  if (window.Html5Qrcode) return;
  const urls = [
    'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js',
    'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'
  ];
  for (const u of urls) {
    try { await loadScript(u); if (window.Html5Qrcode) return; } catch (e) {}
  }
  throw new Error('lib');
}
async function startCamera() {
  if (cam.running) return;
  const my = ++cam.token;
  cam.wanted = true;
  setCam('starting');
  let h = null;
  dbg('BD:' + ('BarcodeDetector' in window) + ' secure:' + window.isSecureContext + ' UA:' + navigator.userAgent.slice(0, 70));
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw {name: 'NotFoundError'};
    if ('BarcodeDetector' in window) {
      let f = FORMATS_NATIVE;
      try { const sup = await BarcodeDetector.getSupportedFormats(); const ok = f.filter(x => sup.includes(x)); if (ok.length) f = ok; } catch (e) {}
      cam.detector = new BarcodeDetector({formats: f});
      const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
      if (my !== cam.token) { stream.getTracks().forEach(t => t.stop()); return; }
      cam.stream = stream;
      camVideo.srcObject = stream;
      dbg('native: stream ok, tracks=' + stream.getTracks().length + ' playing...');
      await camVideo.play();
      camEl.classList.add('native'); camEl.classList.remove('lib');
      cam.running = true;
      setCam('run');
      dbg('native: play ok ' + camVideo.videoWidth + 'x' + camVideo.videoHeight + ' rs=' + camVideo.readyState);
      tick(my);
    } else {
      dbg('lib: loading html5-qrcode...');
      await loadH5();
      if (my !== cam.token) return;
      const F = window.Html5QrcodeSupportedFormats;
      camEl.classList.add('lib'); camEl.classList.remove('native');
      h = new Html5Qrcode('h5q', {formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODE_93, F.ITF, F.CODABAR, F.QR_CODE], verbose: false});
      cam.h5 = h;
      dbg('lib: starting camera...');
      await h.start({facingMode: 'environment'}, {fps: 10, disableFlip: true}, txt => onCode(txt), () => {});
      if (my !== cam.token) { await stopH5(h); return; }
      cam.running = true;
      setCam('run');
      let pc = 0;
      clearInterval(cam.libTimer);
      cam.libTimer = setInterval(() => {
        if (my !== cam.token || !cam.running) { clearInterval(cam.libTimer); return; }
        const vv = document.querySelector('#h5q video');
        pc++;
        dbg('lib #' + pc + ' ' + (vv ? vv.videoWidth + 'x' + vv.videoHeight + ' rs=' + vv.readyState + ' paused=' + vv.paused + ' srcObj=' + !!vv.srcObject + ' tracks=' + (vv.srcObject ? vv.srcObject.getVideoTracks().length : '-') : 'VIDEO YOK'));
        if (pc > 40) clearInterval(cam.libTimer);
      }, 500);
    }
  } catch (e) {
    if (my !== cam.token) return;
    cam.running = false; cam.wanted = false;
    await stopH5(h);
    const txt = typeof e === 'string' ? e : ((e && e.name) || '') + ' ' + ((e && e.message) || '');
    dbg('HATA: ' + txt);
    setCam('err', camErr(e));
  }
}
async function stopH5(h) {
  h = h || cam.h5;
  if (cam.h5 === h) cam.h5 = null;
  if (!h) return;
  try { await h.stop(); } catch (e) {}
  try { h.clear(); } catch (e) {}
}
async function stopCamera() {
  const t = ++cam.token;
  cam.running = false;
  clearTimeout(cam.timer);
  clearInterval(cam.libTimer);
  if (cam.stream) { cam.stream.getTracks().forEach(x => x.stop()); cam.stream = null; }
  camVideo.srcObject = null;
  await stopH5();
  if (t === cam.token) setCam('idle');
}
async function tick(my) {
  if (my !== cam.token || !cam.running) return;
  dbg('native run ' + camVideo.videoWidth + 'x' + camVideo.videoHeight + ' rs=' + camVideo.readyState + ' paused=' + camVideo.paused);
  if (!scanPaused && camVideo.readyState >= 2) {
    try { const r = await cam.detector.detect(camVideo); if (r && r.length) onCode(r[0].rawValue); } catch (e) {}
  }
  if (my === cam.token && cam.running) cam.timer = setTimeout(() => tick(my), 120);
}
function onCode(raw) {
  if (scanPaused || !cam.handler) return;
  const code = String(raw || '').trim();
  if (!code) return;
  const now = Date.now();
  const same = code === cam.lastCode, gap = now - cam.lastAt;
  cam.lastCode = code; cam.lastAt = now;
  if (same && gap < 1500) return;
  try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
  cam.handler(code);
}
function attachCamera(host, handler) {
  host.appendChild(camEl);
  cam.handler = handler;
  if (cam.wanted) startCamera(); else setCam('idle');
}
function leaveScreen() {
  if (camEl.isConnected) { stopCamera(); camEl.remove(); }
  cam.handler = null;
}
document.addEventListener('visibilitychange', () => {
  if (!camEl.isConnected) return;
  if (document.hidden) { if (cam.running) stopCamera(); }
  else if (cam.wanted && !cam.running) startCamera();
});

    };
    if (!d.parcaNo) return fail('Parça numarasını yaz.');
    if (isNaN(d.fiyat) || d.fiyat < 0) return fail('Fiyatı rakamla yaz. Örn. 1250 veya 1250,50');
    if (isNaN(d.min) || d.min < 0) return fail('En az adedi rakamla yaz.');
    if (isNaN(d.adet) || d.adet < 0) return fail('Adedi rakamla yaz.');
    const bdup = d.barkod && S.parts.find(x => x !== p && x.barkod && normCode(x.barkod) === normCode(d.barkod));
    if (bdup) return fail('Bu barkod zaten kayıtlı: ' + bdup.marka + ' ' + bdup.parcaNo);
    const pdup = S.parts.find(x => x !== p && norm(x.parcaNo) === norm(d.parcaNo) && norm(x.marka) === norm(d.marka));
    if (pdup) return fail('Bu marka ve parça no zaten kayıtlı. Stok listesinden düzenleyebilirsin.');
    if (p) {
      const old = p.adet;
      Object.assign(p, {parcaNo: d.parcaNo, marka: d.marka, raf: d.raf, aciklama: d.aciklama, barkod: d.barkod, fiyat: d.fiyat, min: d.min, guncelleme: nowISO()});
      if (d.adet !== old) adjust(p, d.adet - old, 'duzeltme'); else save();
      close(); refresh(); toast('Kaydedildi: ' + p.parcaNo);
    } else {
      const np = addPart(d);
      if (opts.ctx === 'sayim' && S.active) { S.active.items.unshift({partId: np.id, sayilan: d.adet}); save(); }
      close(); refresh(); toast('Eklendi: ' + np.parcaNo);
    }
  });
  const del = q('#f-del');
  if (del) del.addEventListener('click', async () => {
    const ok = await confirmSheet({title: 'Parça silinsin mi?', text: p.parcaNo + ' stoktan kalıcı olarak silinir. Hareket geçmişindeki kayıtları kalır.', ok: 'Parçayı sil', danger: true});
    if (!ok) return;
    S.parts = S.parts.filter(x => x !== p);
    if (S.active) S.active.items = S.active.items.filter(i => i.partId !== p.id);
    save(); close(); refresh(); toast('Parça silindi');
  });
}

/* ================= SAYIM ================= */
function renderSayim() { S.active ? renderSayimActive() : renderSayimHome(); }
function renderSayimHome() {
  $('#screen').innerHTML =
    '<div class="top"><h1>Sayım</h1></div>' +
    '<p class="lead">Rafı gez, barkodları okut. Uygulama sayılan adetle sistemdeki adedi karşılaştırıp farkları gösterir.</p>' +
    '<div class="field"><label for="sraf">Sayılacak raf (isteğe bağlı)</label><input class="in" id="sraf" placeholder="Örn. B-12" autocomplete="off">' +
    '<p class="hint">Raf yazarsan, o rafta kayıtlı ama okutmadığın parçalar da sonuçta görünür.</p></div>' +
    '<button class="btn primary big" data-act="sayim-start">Sayımı başlat</button>' +
    '<h2 class="sec">Geçmiş sayımlar</h2><div id="shist"></div>';
  $('#shist').innerHTML = S.counts.length ? S.counts.map(c =>
    '<button class="pick" data-act="open-count" data-id="' + c.id + '"><b>' + esc(fmtDate(c.tarih)) + '</b><span>' + (c.farkli ? c.farkli + ' parçada fark' : 'Fark yok') + '</span>' +
    '<span>' + (c.raf ? 'Raf ' + esc(c.raf) : 'Raf belirtilmedi') + ', ' + c.okutulan + ' çeşit okutuldu</span><span>' + (c.guncellendi ? 'Stok güncellendi' : 'Stok değişmedi') + '</span></button>'
  ).join('') : '<p class="hint">Henüz sayım yapılmadı.</p>';
}
function renderSayimActive() {
  const a = S.active;
  $('#screen').innerHTML =
    '<div class="top"><h1>Sayım</h1><p class="sum">' + (a.raf ? 'Raf ' + esc(a.raf) : 'Raf seçilmedi, tüm stok') + '</p></div>' +
    '<div id="camhost"></div>' +
    '<div class="field"><label for="manual">Barkodu elle yaz veya parça no ara</label>' +
    '<div class="inrow"><input class="in" id="manual" autocomplete="off" enterkeyhint="search"><button class="btn primary" data-act="manual">Ekle</button></div></div>' +
    '<h2 class="sec" id="scnt">Sayılanlar</h2><div id="clist"></div>' +
    '<div class="actions"><button class="btn primary big" data-act="sayim-finish">Sayımı bitir</button><button class="btn ghost" data-act="sayim-cancel">Sayımı iptal et</button></div>';
  attachCamera($('#camhost'), sayimScan);
  updateSayimList();
}
function countRowHTML(it) {
  const p = partById(it.partId);
  return '<div class="crow" data-cid="' + it.partId + '"><div class="cmain"><b class="pno">' + esc(p.parcaNo) + '</b><span class="sub">' + esc(p.marka) + '</span><span class="sub">Sistemde ' + p.adet + ' adet</span></div>' +
    '<div class="cstep"><button data-act="c-dec" aria-label="Azalt">\u2212</button><input class="in cnum" inputmode="numeric" value="' + it.sayilan + '" aria-label="Sayılan adet"><button data-act="c-inc" aria-label="Artır">+</button></div>' +
    '<div class="cfoot"><span class="bwrap">' + badge(it.sayilan - p.adet) + '</span><button class="lnk" data-act="c-del">Listeden çıkar</button></div></div>';
}
function badge(f) {
  return f === 0 ? '<span class="badge ok">Tutuyor</span>' : '<span class="badge ' + (f < 0 ? 'neg' : 'pos') + '">Fark ' + sign(f) + '</span>';
}
function updateSayimList() {
  const a = S.active; if (!a) return;
  const items = a.items.filter(i => partById(i.partId));
  $('#scnt').textContent = items.length ? 'Sayılanlar (' + items.length + ' çeşit, ' + items.reduce((s, i) => s + i.sayilan, 0) + ' adet)' : 'Sayılanlar';
  $('#clist').innerHTML = items.length ? items.map(countRowHTML).join('') :
    '<p class="hint">Henüz parça okutulmadı. Her kutunun barkodunu okut, her okutuşta sayı bir artar.</p>';
}
function sayimScan(code) {
  const r = lookup(code);
  if (r.kind === 'one') addCount(r.p, 1);
  else if (r.kind === 'many') openPicker(r.ms, p => addCount(p, 1));
  else openPartForm({prefill: Object.assign(prefillFrom(code), {adet: 1}), ctx: 'sayim', note: 'Bu barkod stokta yok. Ekleyince sayıma da eklenir.'});
}
function addCount(p, n) {
  const a = S.active; if (!a) return;
  let it = a.items.find(i => i.partId === p.id);
  if (it) a.items = a.items.filter(i => i !== it); else it = {partId: p.id, sayilan: 0};
  it.sayilan += n;
  a.items.unshift(it);
  save(); updateSayimList();
  toast(p.parcaNo + ': ' + it.sayilan + ' sayıldı');
}
function paintCountRow(row) {
  const it = S.active.items.find(i => i.partId === row.dataset.cid), p = partById(row.dataset.cid);
  if (!it || !p) return;
  row.querySelector('.bwrap').innerHTML = badge(it.sayilan - p.adet);
  const inp = row.querySelector('.cnum');
  if (document.activeElement !== inp) inp.value = it.sayilan;
}
function openSayimResult() {
  const a = S.active;
  if (!a.items.length) { toast('Önce en az bir parça okut', 'err'); return; }
  const rows = a.items.map(it => { const p = partById(it.partId); return p ? {p, beklenen: p.adet, sayilan: it.sayilan} : null; }).filter(Boolean);
  const diffs = rows.filter(r => r.sayilan !== r.beklenen);
  const same = rows.length - diffs.length;
  const unscanned = a.raf ? S.parts.filter(p => norm(p.raf) === norm(a.raf) && p.adet > 0 && !a.items.some(i => i.partId === p.id)) : [];
  const diffRow = r => '<div class="mrow"><div class="l"><b>' + esc(r.p.parcaNo) + '</b><span>' + esc(r.p.marka) + '</span></div><div class="r">' + badge(r.sayilan - r.beklenen) + '<span>Sistemde ' + r.beklenen + ', sayılan ' + r.sayilan + '</span></div></div>';
  const {el, close} = openSheet(
    '<div class="sh-head"><h2>Sayım sonucu</h2><button class="x" data-close aria-label="Kapat">' + X_ICON + '</button></div>' +
    '<p class="lead">' + rows.length + ' çeşit parça okutuldu. ' + (diffs.length ? diffs.length + ' parçada fark var.' : 'Hepsi sistemle tutuyor.') + '</p>' +
    (diffs.length ? '<h3 class="sh2">Farklar</h3>' + diffs.map(diffRow).join('') : '') +
    (same ? '<p class="hint">' + same + ' parçada sayım sistemle tutuyor.</p>' : '') +
    (unscanned.length ? '<h3 class="sh2">Bu rafta okutulmayanlar (' + unscanned.length + ')</h3>' +
      unscanned.map(p => '<div class="mrow"><div class="l"><b>' + esc(p.parcaNo) + '</b><span>' + esc(p.marka) + '</span></div><div class="r"><b>' + p.adet + '</b><span>sistemde</span></div></div>').join('') +
      '<label class="check"><input type="checkbox" id="r-zero"><span>Bunları da 0 say. Raftaki her parçayı okuttuysan işaretle.</span></label>' : '') +
    '<div class="stack"><button class="btn primary big" id="r-apply">Stoğu sayıma göre güncelle</button>' +
    '<button class="btn big" id="r-keep">Stoğu değiştirmeden kaydet</button>' +
    '<button class="btn ghost" data-close>Sayıma dön</button></div>');
  const finish = apply => {
    const zero = !!(unscanned.length && $('#r-zero', el).checked);
    const satirlar = []; let farkli = 0;
    rows.forEach(r => {
      satirlar.push({marka: r.p.marka, parcaNo: r.p.parcaNo, beklenen: r.beklenen, sayilan: r.sayilan});
      if (r.sayilan !== r.beklenen) { farkli++; if (apply) adjust(r.p, r.sayilan - r.beklenen, 'sayim'); }
    });
    if (zero) unscanned.forEach(p => {
      satirlar.push({marka: p.marka, parcaNo: p.parcaNo, beklenen: p.adet, sayilan: 0});
      farkli++; if (apply) adjust(p, -p.adet, 'sayim');
    });
    S.counts.unshift({id: uid(), tarih: nowISO(), raf: a.raf, okutulan: rows.length, farkli, guncellendi: apply, satirlar});
    if (S.counts.length > 30) S.counts.length = 30;
    S.active = null; save();
    close(); render();
    toast(apply ? 'Stok sayıma göre güncellendi' : 'Sayım kaydedildi, stok değişmedi');
  };
  $('#r-apply', el).addEventListener('click', () => finish(true));
  $('#r-keep', el).addEventListener('click', () => finish(false));
}
function openCountDetail(id) {
  const c = S.counts.find(x => x.id === id); if (!c) return;
  openSheet(
    '<div class="sh-head"><h2>Sayım, ' + esc(fmtDate(c.tarih)) + '</h2><button class="x" data-close aria-label="Kapat">' + X_ICON + '</button></div>' +
    '<p class="lead">' + (c.raf ? 'Raf ' + esc(c.raf) + '. ' : '') + (c.guncellendi ? 'Stok bu sayıma göre güncellendi.' : 'Stok değiştirilmedi.') + '</p>' +
    c.satirlar.map(r => '<div class="mrow"><div class="l"><b>' + esc(r.parcaNo) + '</b><span>' + esc(r.marka) + '</span></div><div class="r">' + badge(r.sayilan - r.beklenen) + '<span>Sistemde ' + r.beklenen + ', sayılan ' + r.sayilan + '</span></div></div>').join(''));
}

/* ================= DAHA ================= */
let DL = null;
function renderDaha() {
  const dis = DL ? '' : ' disabled';
  const ms = S.moves.slice(0, 30);
  $('#screen').innerHTML =
    '<div class="top"><h1>Daha fazla</h1></div>' +
    '<div class="block" style="border-top:0"><h2>Excel\'e aktar</h2><p>Stok listesini Excel\'de doğrudan açılan bir dosya (CSV) olarak indir.</p>' +
    '<div class="stack"><button class="btn primary" data-act="export-stok"' + dis + '>Stok listesini indir</button><button class="btn" data-act="export-moves"' + dis + '>Hareket geçmişini indir</button></div>' +
    (DL ? '' : '<p class="hint" style="margin-top:8px">İndirme bu görünümde kullanılamıyor.</p>') + '</div>' +
    '<div class="block"><h2>Verilerin nerede durduğu</h2><p>Şu an tüm veriler bu telefonun tarayıcısında saklanır. Başka telefonda veya bilgisayarda görünmez. Birden fazla cihaz ve dükkânlar arası ortak barkod kataloğu için sunucu gerekir. Bu deneme sürümünde yok.</p></div>' +
    '<div class="block"><h2>Örnek veri</h2><p>Uygulamayı denemek için 12 örnek parça ekle. Barkodları uydurmadır, gerçek ürünlerle eşleşmez.</p><button class="btn" data-act="sample">Örnek parçaları ekle</button></div>' +
    '<div class="block"><h2>Hareket geçmişi</h2>' + (ms.length ? ms.map(m =>
      '<div class="mrow"><div class="l"><b>' + esc(m.parcaNo) + '</b><span>' + esc(TUR[m.tur] || m.tur) + ', ' + esc(fmtDate(m.tarih)) + '</span></div><div class="r"><b class="' + (m.degisim > 0 ? 'pos-t' : m.degisim < 0 ? 'neg-t' : '') + '">' + sign(m.degisim) + '</b><span>' + m.sonAdet + ' adet</span></div></div>').join('') : '<p>Henüz hareket yok.</p>') + '</div>' +
    '<div class="block"><button class="btn danger" data-act="wipe">Tüm verileri sil</button></div>';
}
const csvCell = v => { v = String(v == null ? '' : v); return /[";\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCSV = rows => '\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
const dec = n => String(Number(n) || 0).replace('.', ',');
async function exportCSV(kind) {
  if (!DL) { toast('İndirme bu görünümde kullanılamıyor', 'err'); return; }
  const day = new Date().toLocaleDateString('sv-SE');
  let rows, name;
  if (kind === 'stok') {
    name = 'stok-' + day + '.csv';
    rows = [['Barkod', 'Marka', 'Parça no', 'Açıklama', 'Raf', 'Adet', 'Fiyat', 'Değer', 'Son güncelleme']]
      .concat(S.parts.map(p => [p.barkod, p.marka, p.parcaNo, p.aciklama, p.raf, p.adet, dec(p.fiyat), dec(p.adet * (p.fiyat || 0)), fmtDate(p.guncelleme)]));
  } else {
    name = 'hareketler-' + day + '.csv';
    rows = [['Tarih', 'Marka', 'Parça no', 'Tür', 'Değişim', 'Sonraki adet']]
      .concat(S.moves.map(m => [fmtDate(m.tarih), m.marka, m.parcaNo, TUR[m.tur] || m.tur, m.degisim, m.sonAdet]));
  }
  if (rows.length < 2) { toast('Aktarılacak kayıt yok', 'err'); return; }
  try { await DL.save({filename: name, data: toCSV(rows)}); toast('Dosya hazır'); }
  catch (e) { if (e && e.code === 'declined') toast('İndirme iptal edildi'); else toast('Dosya indirilemedi', 'err'); }
}
const SAMPLE = [
  ['Mann-Filter', 'W 7031', 'Yağ filtresi (örnek)', 'A-01', 420, 14, 4],
  ['Mann-Filter', 'C 2295', 'Hava filtresi (örnek)', 'A-02', 560, 9, 3],
  ['Bosch', 'F 0264', 'Yakıt filtresi (örnek)', 'A-03', 690, 6, 2],
  ['Bosch', 'BP 1740', 'Ön fren balatası (örnek)', 'B-01', 1850, 5, 2],
  ['Brembo', 'BR 09.A2', 'Fren diski (örnek)', 'B-03', 2950, 2, 4],
  ['Gates', 'GT 6PK1180', 'V kayışı (örnek)', 'B-06', 780, 7, 3],
  ['Sachs', 'SB 3120', 'Amortisör (örnek)', 'C-04', 2400, 3, 2],
  ['Valeo', 'VL 5581', 'Debriyaj seti (örnek)', 'C-01', 5900, 2, 1],
  ['Febi', 'FB 3341', 'Rotil (örnek)', 'C-06', 640, 4, 2],
  ['NGK', 'BKR 6E', 'Buji (örnek)', 'D-02', 210, 24, 8],
  ['Osram', 'H7 12V', 'Far ampulü (örnek)', 'D-05', 330, 0, 6],
  ['Castrol', '5W-30 4L', 'Motor yağı (örnek)', 'E-01', 1450, 8, 4]
];
function ean13(stem) { let s = 0; for (let i = 0; i < 12; i++) s += (+stem[i]) * (i % 2 ? 3 : 1); return stem + ((10 - (s % 10)) % 10); }
function loadSample() {
  let n = 0;
  SAMPLE.forEach((r, i) => {
    const bk = ean13('200100000' + String(i + 1).padStart(3, '0'));
    if (S.parts.some(p => p.barkod === bk)) return;
    addPart({barkod: bk, marka: r[0], parcaNo: r[1], aciklama: r[2], raf: r[3], fiyat: r[4], adet: r[5], min: r[6]}); n++;
  });
  refresh();
  toast(n ? n + ' örnek parça eklendi' : 'Örnek parçalar zaten ekli');
}

/* ================= olaylar ================= */
function doManual() {
  const inp = $('#manual'); if (!inp) return;
  const v = inp.value.trim(); if (!v) return;
  inp.value = '';
  (ui.tab === 'sayim' ? sayimScan : taraScan)(v);
}
const ACT = {
  tab: b => go(b.dataset.tab),
  mode: b => { ui.mode = b.dataset.v; updateTara(); },
  filter: b => { ui.filter = b.dataset.v; updateStokList(); },
  'open-part': b => { const p = partById(b.dataset.id); if (p) openPartForm({part: p, ctx: 'stok'}); },
  'new-part': b => openPartForm({ctx: 'stok', prefill: b.dataset.pre ? {parcaNo: b.dataset.pre} : null}),
  camstart: () => startCamera(),
  camstop: () => { cam.wanted = false; stopCamera(); },
  manual: doManual,
  'sayim-start': () => {
    const raf = ($('#sraf').value || '').trim();
    S.active = {id: uid(), baslangic: nowISO(), raf, items: []};
    save(); render();
  },
  'sayim-finish': () => openSayimResult(),
  'sayim-cancel': async () => {
    const ok = await confirmSheet({title: 'Sayım iptal edilsin mi?', text: 'Okuttuğun parçalar silinir. Stokta hiçbir şey değişmez.', ok: 'Sayımı iptal et', danger: true});
    if (!ok) return;
    S.active = null; save(); leaveScreen(); render();
  },
  'c-inc': b => cAdjust(b, 1),
  'c-dec': b => cAdjust(b, -1),
  'c-del': b => {
    const row = b.closest('.crow');
    S.active.items = S.active.items.filter(i => i.partId !== row.dataset.cid);
    save(); updateSayimList();
  },
  'open-count': b => openCountDetail(b.dataset.id),
  'export-stok': () => exportCSV('stok'),
  'export-moves': () => exportCSV('moves'),
  sample: () => loadSample(),
  wipe: async () => {
    const ok = await confirmSheet({title: 'Tüm veriler silinsin mi?', text: 'Bu telefondaki tüm parçalar, hareketler ve sayımlar silinir. Geri alınamaz. Önce Excel\'e aktarmayı düşün.', ok: 'Hepsini sil', danger: true});
    if (!ok) return;
    S = fresh(); save(); render(); toast('Tüm veriler silindi');
  }
};
function cAdjust(b, d) {
  const row = b.closest('.crow');
  const it = S.active.items.find(i => i.partId === row.dataset.cid); if (!it) return;
  it.sayilan = Math.max(0, it.sayilan + d);
  save(); paintCountRow(row);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.q = t.value; updateStokList(); }
  else if (t.classList && t.classList.contains('cnum')) {
    const row = t.closest('.crow');
    const it = S.active && S.active.items.find(i => i.partId === row.dataset.cid); if (!it) return;
    const n = parseInt(t.value, 10);
    it.sayilan = isNaN(n) || n < 0 ? 0 : n;
    save(); paintCountRow(row);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'manual') { e.preventDefault(); doManual(); }
});
document.addEventListener('focusout', e => {
  if (e.target.classList && e.target.classList.contains('cnum')) { const row = e.target.closest('.crow'); if (row && S.active) paintCountRow(row); }
});

/* indirme yeteneği (yayınlanmış sayfada gelir) */
try {
  if (window.claude && window.claude.use) {
    window.claude.use('downloads').then(d => { DL = d || null; if (ui.tab === 'daha' && !layers.length) renderDaha(); }).catch(() => {});
  }
} catch (e) {}

render();
})();
</script>
